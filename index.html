<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1d3a28" />
  <meta name="description" content="Bober Willow Cut — fan game by a holder. A farm simulator on the creek bank." />
  <title>Bober Willow Cut</title>
  <link rel="icon" href="assets/icons/bober-willow.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/willow-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/willow-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      --ink: #14210f; --cream: #f3ead2; --yellow: #f5c400; --soil: #6b3f22;
      --leaf: #2f6b32; --water: #1f6f93; --danger: #a33b32;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--ink); color: var(--cream);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      user-select: none; overflow: hidden; touch-action: manipulation;
    }
    #app {
      display: flex; flex-direction: column; height: 100dvh; height: 100svh;
      width: 100%; max-width: 480px; margin: 0 auto; background: #1d3a28;
      position: relative; overflow: hidden;
    }
    header {
      flex: 0 0 auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
      padding: 8px 8px 4px; background: #14210f;
    }
    .chip {
      background: #24381f; border: 2px solid var(--yellow); color: var(--cream);
      border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 14px;
      line-height: 1.2;
    }
    #stones { color: var(--yellow); }
    #subrow {
      display: flex; gap: 8px; padding: 0 8px 6px; background: #14210f;
      font-size: 12px; font-weight: 800; color: #d5e6c4;
    }
    #stage { flex: 1 1 auto; position: relative; min-height: 220px; background: #3d6b32; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #verb {
      margin: 0; min-height: 18px; padding: 4px 10px 0; background: #14210f;
      font-size: 13px; font-weight: 800; color: var(--cream);
    }
    #dock {
      flex: 0 0 auto; display: flex; gap: 8px; padding: 8px;
      background: #14210f; padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }
    button {
      font-family: inherit; font-weight: 900; cursor: pointer;
    }
    #dock button {
      flex: 1 1 0; border: 3px solid var(--yellow); background: var(--yellow); color: var(--ink);
      border-radius: 14px; padding: 12px 8px; font-size: 15px;
    }
    #btn-sleep { background: var(--cream); }
    #dock button.hidden, .overlay.hidden, .hidden { display: none !important; }
    .overlay {
      position: absolute; inset: 0; z-index: 5; background: rgba(20, 33, 15, 0.55);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .card {
      width: min(100%, 380px); background: #1d3a28; border: 3px solid var(--yellow);
      border-radius: 18px; padding: 16px 14px 14px; max-height: 100%; overflow: auto;
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0.02em; color: var(--yellow); line-height: 1.05; }
    h2 { margin: 0 0 8px; font-size: 22px; color: var(--yellow); }
    p { margin: 0 0 8px; font-weight: 700; line-height: 1.35; }
    .fan { color: #d5e6c4; font-size: 13px; }
    .play {
      width: 100%; border: 3px solid var(--yellow); background: var(--yellow); color: var(--ink);
      border-radius: 14px; padding: 12px 10px; font-size: 16px; margin-top: 6px;
    }
    .ghost { background: transparent; color: var(--cream); }
    .row { display: flex; gap: 6px; margin: 6px 0; align-items: center; }
    .row strong { flex: 1; font-size: 14px; }
    .row button { flex: 0 0 auto; border: 2px solid var(--yellow); background: #24381f; color: var(--cream); border-radius: 10px; padding: 8px 8px; font-size: 12px; }
    .row button.on { background: var(--yellow); color: var(--ink); }
    #toast {
      position: absolute; left: 12px; right: 12px; top: 78px; z-index: 6;
      background: #14210f; border: 2px solid var(--cream); color: var(--cream);
      border-radius: 12px; padding: 8px 10px; font-weight: 800; text-align: center;
    }
    .price { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="chip" id="when">SPRING · DAY 1</div>
      <div class="chip" id="clock">6:00</div>
      <div class="chip" id="stones">6 creek stones</div>
    </header>
    <div id="subrow">
      <span id="trough">Trough 0</span>
      <span id="mill-read">Mill empty</span>
      <button id="btn-pack" type="button" style="margin-left:auto;border:0;background:transparent;color:#f5c400;font-weight:900;">PACK</button>
    </div>
    <p id="verb">Tap the ground to walk.</p>
    <div id="stage">
      <canvas id="view" width="420" height="480"></canvas>
      <div id="toast" class="hidden"></div>
      <div id="splash" class="overlay">
        <div class="card">
          <h1>BOBER WILLOW CUT</h1>
          <p>A farm simulator. Four seasons on the bank.</p>
          <p>The bank Burrow Hop called home is a farm now. Nightfall is still downriver.</p>
          <p class="fan">Fan game by a holder. No wallet. No ads.</p>
          <button class="play" id="btn-start" type="button">START THE YEAR</button>
          <button class="play ghost" id="btn-continue" type="button">CONTINUE</button>
          <button class="play ghost" id="btn-notes" type="button">BANK NOTES</button>
        </div>
      </div>
      <div id="dawn" class="overlay hidden">
        <div class="card">
          <h2 id="dawn-title">SPRING · DAY 2</h2>
          <p id="dawn-body"></p>
          <button class="play" id="btn-work" type="button">WORK</button>
        </div>
      </div>
      <div id="sheet" class="overlay hidden">
        <div class="card">
          <h2 id="sheet-title">Sheet</h2>
          <div id="sheet-body"></div>
          <button class="play ghost" id="btn-sheet-close" type="button">CLOSE</button>
        </div>
      </div>
    </div>
    <div id="dock">
      <button id="btn-chores" type="button">CHORES</button>
      <button id="btn-chaff" type="button" class="hidden">CHAFF</button>
      <button id="btn-sleep" type="button">SLEEP</button>
    </div>
  </div>
  <script>
(function () {
  "use strict";

  var KEY = "bober-willow-cut-v1";
  var VW = 420, VH = 480, WORLD_W = 2520, WORLD_H = 2400;
  var DAY_LEN = 180, MILL_NEED = 72, WALK = 70, REACH = 68;
  var SEASON = ["SPRING", "SUMMER", "FALL", "WINTER"];
  var CROP_NAME = { reedbean: "Reedbean", beet: "Pond beet", lantern: "Lanternpod" };
  var NEED = { reedbean: 3, beet: 5, lantern: 4 };
  var SEASON_OF = { reedbean: 0, beet: 1, lantern: 2 };
  var SEED_KEY = { reedbean: "seedReed", beet: "seedBeet", lantern: "seedLantern" };
  var SEED_COST = { reedbean: 3, beet: 4, lantern: 4 };
  var PRICE = {
    reedbean: [8, 5, 4, 6],
    meal: [16, 12, 10, 14],
    beet: [4, 10, 5, 4],
    lantern: [4, 4, 12, 6],
    willow: [6, 8, 10, 3],
    egg: [5, 5, 6, 8],
    cream: [7, 7, 8, 9]
  };
  var DOOR = { x: 1240, y: 1196 };
  var MILLP = { x: 1560, y: 1188 };
  var MOSS = { x: 2280, y: 1288 };
  var POND = { x: 1004, y: 1136, rx: 108, ry: 62 };
  var SWAN = { x: 1092, y: 1172 };
  var PLOD = { x: 1408, y: 1240 };
  var FILTER = { nib: "brightness(0.78)", puddle: "brightness(1.12)", twig: "hue-rotate(-16deg)", moss: "hue-rotate(70deg) saturate(0.85)" };

  var canvas = document.getElementById("view");
  var ctx = canvas.getContext("2d");
  var viewScale = 1, viewOx = 0, viewOy = 0, dpr = 1, cssW = 420, cssH = 480;
  var camX = 0, camY = 0, looking = false;
  var ptr = null, mode = "splash", sheetBack = "play", toastTill = 0, lastTs = 0;
  var state;
  var flakes = [];
  var imgHat = new Image(); imgHat.src = "assets/sprites/bober-hat.png";
  var imgIdle = new Image(); imgIdle.src = "assets/sprites/bober-idle.png";
  var imgWalk = new Image(); imgWalk.src = "assets/sprites/bober-walk.png";

  function bed(x, y, st, crop, days, fert) {
    return { x: x, y: y, state: st, crop: crop || null, days: days || 0, need: crop ? NEED[crop] : 0, wet: false, fert: fert || 0 };
  }
  function fresh() {
    state = {
      year: 1, season: 0, day: 1, clock: 0, stones: 6, fodder: 0, chaff: 0,
      items: { reedbean: 0, beet: 0, lantern: 0, willow: 0, meal: 0, egg: 0, cream: 0, seedReed: 2, seedBeet: 0, seedLantern: 0 },
      mill: { sack: 0, t: 0 },
      beds: [
        bed(1105, 1275, "growing", "reedbean", 1, 1),
        bed(1195, 1335, "growing", "reedbean", 1, 1),
        bed(1105, 1365, "tilled", null, 0, 1),
        bed(1195, 1425, "tilled", null, 0, 1),
        bed(1320, 1560, "stony", null, 0, 0),
        bed(1420, 1620, "stony", null, 0, 0),
        bed(1200, 1700, "wild", null, 0, 0),
        bed(1320, 1760, "wild", null, 0, 0)
      ],
      willows: [
        { x: 180, y: 1160, days: 0 },
        { x: 270, y: 1240, days: 0 },
        { x: 150, y: 1310, days: 0 },
        { x: 300, y: 1100, days: 0 }
      ],
      grass: [
        { x: 1336, y: 1264, ready: true, wait: 0 },
        { x: 1396, y: 1324, ready: true, wait: 0 },
        { x: 1296, y: 1336, ready: true, wait: 0 },
        { x: 1472, y: 1288, ready: true, wait: 0 }
      ],
      player: { x: 1240, y: 1256, tx: null, ty: null, face: 1, pending: null },
      crew: [
        { id: "nib", name: "NIB", x: 1144, y: 1232, tx: null, ty: null, face: 1, chore: null, cool: 0 },
        { id: "puddle", name: "PUDDLE", x: 1332, y: 1232, tx: null, ty: null, face: -1, chore: null, cool: 0 },
        { id: "twig", name: "TWIG", x: 1288, y: 1288, tx: null, ty: null, face: 1, chore: null, cool: 0 }
      ],
      home: {
        nib: { x: 1144, y: 1232 },
        puddle: { x: 1332, y: 1232 },
        twig: { x: 1288, y: 1288 }
      }
    };
  }

  function price(key) { return PRICE[key][state.season]; }
  function seasonName() { return SEASON[state.season]; }
  function whenText() { return seasonName() + " · DAY " + state.day; }
  function clockText() {
    var h = 6 + (state.clock / DAY_LEN) * 10;
    var hh = Math.floor(h);
    var mm = Math.floor((h - hh) * 60);
    return (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
  }
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    toastTill = performance.now() + 1600;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return false;
      state = JSON.parse(raw);
      return true;
    } catch (e) { return false; }
  }
  function showSplash() {
    mode = "splash";
    document.getElementById("splash").classList.remove("hidden");
    document.getElementById("btn-continue").classList.toggle("hidden", !localStorage.getItem(KEY));
  }

  function blocked(x, y) {
    if (x < 28 || y < 300 || x > WORLD_W - 28 || y > WORLD_H - 28) return true;
    var nx = (x - POND.x) / (POND.rx * 0.72);
    var ny = (y - POND.y) / (POND.ry * 0.72);
    if (nx * nx + ny * ny < 1) return true;
    if (x > 1368 && x < 1508 && y > 1088 && y < 1172) return true;
    if (x > 1188 && x < 1304 && y > 1104 && y < 1184) return true;
    return false;
  }
  function moveEnt(ent, dt) {
    if (ent.tx == null) return false;
    var dx = ent.tx - ent.x, dy = ent.ty - ent.y;
    var dist = Math.hypot(dx, dy);
    if (dist < 5) { ent.x = ent.tx; ent.y = ent.ty; ent.tx = null; ent.ty = null; return true; }
    var step = Math.min(WALK * dt, dist);
    var nx = ent.x + dx / dist * step;
    var ny = ent.y + dy / dist * step;
    if (!blocked(nx, ny)) { ent.x = nx; ent.y = ny; }
    else { ent.tx = null; ent.ty = null; }
    ent.face = dx < 0 ? -1 : 1;
    return false;
  }

  function harvest(i) {
    var b = state.beds[i];
    if (b.state !== "ready" || !b.crop) return;
    var n = 1 + (b.fert || 0);
    state.items[b.crop] += n;
    b.fert = Math.max(0, (b.fert || 0) - 1);
    b.state = "stubble";
    b.crop = null;
    b.days = 0;
    b.wet = false;
    b.need = 0;
    toast("Harvest " + n);
    save();
  }
  function waterBed(i) {
    var b = state.beds[i];
    if (b.state !== "seeded" && b.state !== "growing") return "Nothing to water";
    if (b.wet) return "Already watered";
    b.wet = true;
    return null;
  }
  function plant(i, crop) {
    var b = state.beds[i];
    if (b.state !== "tilled") return "Till it first";
    if (state.season !== SEASON_OF[crop]) return "Wrong season";
    var key = SEED_KEY[crop];
    if (!state.items[key]) return "No " + CROP_NAME[crop] + " seed";
    state.items[key] -= 1;
    b.state = "seeded";
    b.crop = crop;
    b.days = 0;
    b.need = NEED[crop];
    b.wet = false;
    save();
    return null;
  }
  function layChaff(i) {
    var b = state.beds[i];
    if (state.chaff <= 0) return "No chaff";
    if (b.state === "wild" || b.state === "stony") return "Clear the bed first";
    if ((b.fert || 0) >= 2) return "Soil is full";
    state.chaff -= 1;
    b.fert = (b.fert || 0) + 1;
    save();
    return null;
  }
  function cutGrass(i) {
    var g = state.grass[i];
    if (!g || !g.ready) return;
    g.ready = false;
    g.wait = 2;
    state.fodder += 1;
    save();
  }
  function loadMill() {
    if (state.mill.sack > 0) return "Mill is stocked";
    if (state.items.reedbean <= 0) return "Need a reedbean sack";
    state.items.reedbean -= 1;
    state.mill.sack = 1;
    state.mill.t = 0;
    save();
    return null;
  }
  function cutWillow(i) {
    var w = state.willows[i];
    if (state.season === 3) return "Winter rest";
    if (w.days < 4) return "Not ready to cut";
    w.days = 0;
    state.items.willow += 1;
    toast("Willow cut");
    save();
    return null;
  }

  function workBed(i) {
    var b = state.beds[i];
    if (b.state === "wild") { b.state = "stony"; toast("Brush cleared"); return; }
    if (b.state === "stony") { b.state = "tilled"; toast("Stones picked"); return; }
    if (b.state === "stubble") { b.state = "tilled"; toast("Stubble cleared"); return; }
    if (b.state === "tilled") { openPlant(i); return; }
    if (b.state === "ready") { harvest(i); return; }
    var err = waterBed(i);
    if (err) toast(err);
  }

  function endDay() {
    if (mode === "dawn") return;
    var lines = [];
    if (state.mill.sack > 0 && state.mill.t >= MILL_NEED) {
      state.mill.sack = 0;
      state.mill.t = 0;
      state.items.meal += 1;
      state.chaff += 1;
      lines.push("The mill made meal and left chaff.");
    } else if (state.mill.sack > 0) {
      lines.push("The mill is still working.");
    }
    if (state.fodder > 0) {
      state.fodder -= 1;
      state.items.egg += 1;
      lines.push("The reedswan left an egg.");
    } else {
      lines.push("No egg. The trough was empty.");
    }
    if (state.fodder > 0) {
      state.fodder -= 1;
      state.items.cream += 1;
      lines.push("The plodder left cream.");
    }
    state.day += 1;
    var turned = false;
    if (state.day > 7) {
      state.day = 1;
      state.season = (state.season + 1) % 4;
      if (state.season === 0) state.year += 1;
      turned = true;
    }
    if (turned) {
      state.beds.forEach(function (b) {
        if (!b.crop) return;
        if (SEASON_OF[b.crop] !== state.season && b.state !== "stubble" && b.state !== "tilled") {
          lines.push(CROP_NAME[b.crop] + " withered.");
          b.state = "stubble";
          b.crop = null;
          b.days = 0;
          b.need = 0;
          b.wet = false;
        }
      });
    }
    state.beds.forEach(function (b) {
      if (b.state !== "seeded" && b.state !== "growing") return;
      if (b.wet && b.crop && SEASON_OF[b.crop] === state.season) {
        b.days += 1;
        if (b.days >= b.need) b.state = "ready";
        else b.state = "growing";
        lines.push(CROP_NAME[b.crop] + " " + Math.min(b.days, b.need) + " of " + b.need + ".");
      } else if (b.crop) {
        lines.push(CROP_NAME[b.crop] + " waited. Still " + b.days + " of " + b.need + ".");
      }
      b.wet = false;
    });
    state.willows.forEach(function (w) {
      if (state.season === 3) return;
      if (w.days < 4) w.days += 1;
    });
    var willowReady = state.willows.some(function (w) { return w.days >= 4; });
    lines.push(willowReady ? "A willow stool is ready to cut." : "Willow is not ready to cut.");
    if (state.season !== 3) {
      state.grass.forEach(function (g) {
        if (g.ready) return;
        g.wait -= 1;
        if (g.wait <= 0) g.ready = true;
      });
    }
    state.crew.forEach(function (c) {
      c.chore = null;
      c.tx = null;
      c.ty = null;
      var h = state.home[c.id];
      c.x = h.x; c.y = h.y;
    });
    state.player.tx = null;
    state.player.ty = null;
    state.player.pending = null;
    state.clock = 0;
    mode = "dawn";
    closeSheet();
    document.getElementById("dawn-title").textContent = whenText() + (state.year > 1 ? " · Y" + state.year : "");
    document.getElementById("dawn-body").textContent = lines.join(" ");
    document.getElementById("dawn").classList.remove("hidden");
    hud();
    save();
  }

  function crewThink(c, dt) {
    if (c.cool > 0) c.cool -= dt;
    if (!c.chore) {
      var h = state.home[c.id];
      if (Math.hypot(c.x - h.x, c.y - h.y) > 8) { c.tx = h.x; c.ty = h.y; }
      return;
    }
    if (c.chore === "field") {
      var idx = -1, k;
      for (k = 0; k < state.beds.length; k++) {
        var b = state.beds[k];
        if ((b.state === "seeded" || b.state === "growing") && !b.wet) { idx = k; break; }
      }
      if (idx < 0) {
        for (k = 0; k < state.beds.length; k++) if (state.beds[k].state === "ready") { idx = k; break; }
      }
      if (idx < 0) return;
      var bed = state.beds[idx];
      if (Math.hypot(c.x - bed.x, c.y - bed.y) > REACH) { c.tx = bed.x; c.ty = bed.y; return; }
      if (c.cool > 0) return;
      if (bed.state === "ready") harvest(idx);
      else bed.wet = true;
      c.cool = 0.55;
    } else if (c.chore === "barn") {
      var g = null, gi = -1, gk;
      for (gk = 0; gk < state.grass.length; gk++) if (state.grass[gk].ready) { g = state.grass[gk]; gi = gk; break; }
      if (!g) { c.tx = 1360; c.ty = 1248; return; }
      if (Math.hypot(c.x - g.x, c.y - g.y) > REACH) { c.tx = g.x; c.ty = g.y; return; }
      if (c.cool > 0) return;
      cutGrass(gi);
      c.cool = 0.55;
    } else if (c.chore === "mill") {
      if (state.mill.sack > 0 || state.items.reedbean <= 0) { c.tx = MILLP.x; c.ty = MILLP.y + 36; return; }
      if (Math.hypot(c.x - MILLP.x, c.y - MILLP.y) > REACH) { c.tx = MILLP.x; c.ty = MILLP.y + 36; return; }
      if (c.cool > 0) return;
      loadMill();
      c.cool = 0.4;
    }
  }

  function hud() {
    document.getElementById("when").textContent = whenText();
    document.getElementById("clock").textContent = clockText();
    document.getElementById("stones").textContent = state.stones + " creek stones";
    document.getElementById("trough").textContent = "Trough " + state.fodder;
    var mill = state.mill;
    document.getElementById("mill-read").textContent = mill.sack ? ("Mill " + Math.min(100, Math.floor(mill.t / MILL_NEED * 100)) + "%") : "Mill empty";
    document.getElementById("btn-chaff").classList.toggle("hidden", state.chaff <= 0);
    var near = nearest(state.player.x, state.player.y, REACH + 8);
    document.getElementById("verb").textContent = near ? verbFor(near) : "Tap the ground to walk. Sleep ends the day.";
  }
  function verbFor(hit) {
    if (hit.kind === "bed") {
      var b = state.beds[hit.i];
      if (b.state === "wild") return "Clear brush";
      if (b.state === "stony") return "Pick stones";
      if (b.state === "tilled") return "Plant";
      if (b.state === "ready") return "Harvest " + (CROP_NAME[b.crop] || "");
      if (b.state === "stubble") return "Clear stubble";
      if (b.wet) return (CROP_NAME[b.crop] || "Bed") + " is watered";
      return "Water " + (CROP_NAME[b.crop] || "bed");
    }
    if (hit.kind === "willow") {
      if (state.season === 3) return "Willow is resting";
      if (state.willows[hit.i].days >= 4) return "Cut willow";
      return "Willow not ready · " + state.willows[hit.i].days + " of 4";
    }
    if (hit.kind === "grass") return state.grass[hit.i].ready ? "Cut grass into the trough" : "Grass cut";
    if (hit.kind === "mill") return state.mill.sack ? "Mill is stocked" : "Load a reedbean sack";
    if (hit.kind === "moss") return "Moss's stall · " + seasonName().toLowerCase() + " prices";
    if (hit.kind === "door") return "Sleep in the lodge";
    return "";
  }
  function nearest(x, y, maxR) {
    var best = null, bestD = maxR;
    function consider(hit) {
      var d = Math.hypot(x - hit.x, y - hit.y);
      if (d < bestD) { bestD = d; best = hit; }
    }
    state.beds.forEach(function (b, i) { consider({ kind: "bed", i: i, x: b.x, y: b.y }); });
    state.willows.forEach(function (w, i) { consider({ kind: "willow", i: i, x: w.x, y: w.y }); });
    state.grass.forEach(function (g, i) { consider({ kind: "grass", i: i, x: g.x, y: g.y }); });
    consider({ kind: "mill", x: MILLP.x, y: MILLP.y });
    consider({ kind: "moss", x: MOSS.x, y: MOSS.y });
    consider({ kind: "door", x: DOOR.x, y: DOOR.y });
    return best;
  }
  function doHit(hit) {
    if (hit.kind === "bed") workBed(hit.i);
    else if (hit.kind === "willow") { var e = cutWillow(hit.i); if (e) toast(e); }
    else if (hit.kind === "grass") { if (state.grass[hit.i].ready) cutGrass(hit.i); else toast("Cut already"); }
    else if (hit.kind === "mill") { var m = loadMill(); if (m) toast(m); else toast("Sack loaded"); }
    else if (hit.kind === "moss") openShop();
    else if (hit.kind === "door") endDay();
  }

  function onTap(x, y) {
    if (mode !== "play") return;

    var hit = nearest(x, y, 42);
    if (hit && Math.hypot(state.player.x - hit.x, state.player.y - hit.y) <= REACH) {
      state.player.pending = null;
      doHit(hit);
      hud();
      return;
    }
    var tx = hit ? hit.x : x;
    var ty = hit ? hit.y : y;

    state.player.tx = tx;
    state.player.ty = ty;

  function resize() {
    var stage = document.getElementById("stage");
    var r = stage.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cssW = Math.max(1, r.width);
    cssH = Math.max(1, r.height);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    viewScale = Math.min((cssW - 8) / VW, (cssH - 8) / VH);
    if (!(viewScale > 0)) viewScale = 1;
    var vwPx = VW * viewScale;
    var vhPx = VH * viewScale;
    viewOx = (cssW - vwPx) / 2;
    var extra = cssH - vhPx;
    viewOy = extra > 12 ? 4 : extra / 2;
  }
  function clampCam() {
    camX = Math.max(0, Math.min(WORLD_W - VW, camX));
    camY = Math.max(0, Math.min(WORLD_H - VH, camY));
  }
  function worldFromEvent(ev) {
    var rect = canvas.getBoundingClientRect();
    var x = ev.clientX - rect.left;
    var y = ev.clientY - rect.top;
    var vx = (x - viewOx) / viewScale;
    var vy = (y - viewOy) / viewScale;
    return { x: vx + camX, y: vy + camY };
  }

  function drawGround() {

  function drawBed(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.fillStyle = b.wet ? "#3e5a28" : "#6b3f22";
    ctx.fillRect(-26, -16, 52, 32);
    ctx.strokeStyle = "#3a2414";
    ctx.strokeRect(-26, -16, 52, 32);
    if (b.state === "stony") {
      ctx.fillStyle = "#b7b1a6";
      ctx.beginPath(); ctx.arc(-8, 0, 7, 0, Math.PI * 2); ctx.arc(10, 4, 5, 0, Math.PI * 2); ctx.fill();
    } else if (b.state === "wild") {
      ctx.strokeStyle = "#2f6b32";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-8, 8); ctx.lineTo(-10, -8);
      ctx.moveTo(0, 8); ctx.lineTo(2, -12);
      ctx.moveTo(8, 8); ctx.lineTo(10, -6);
      ctx.stroke();
    } else if (b.state === "tilled" || b.state === "stubble" || b.state === "seeded" || b.state === "growing" || b.state === "ready") {
      ctx.strokeStyle = "rgba(243,234,210,0.35)";
      ctx.beginPath();
      ctx.moveTo(-18, -6); ctx.lineTo(18, -6);
      ctx.moveTo(-18, 4); ctx.lineTo(18, 4);
      ctx.stroke();
    }
    if (b.state === "stubble") {
      ctx.strokeStyle = "#e6d7a8";
      ctx.beginPath();
      ctx.moveTo(-8, 8); ctx.lineTo(-8, -2);
      ctx.moveTo(0, 8); ctx.lineTo(0, 0);
      ctx.moveTo(8, 8); ctx.lineTo(8, -4);
      ctx.stroke();
    }
    if (b.crop && (b.state === "seeded" || b.state === "growing" || b.state === "ready")) {
      var h = 6 + Math.min(b.days, b.need) * 4;
      var col = b.crop === "beet" ? "#a33b62" : b.crop === "lantern" ? "#e0a030" : "#2f6b32";
      ctx.strokeStyle = col;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 8); ctx.lineTo(0, 8 - h);
      ctx.moveTo(-6, 6); ctx.lineTo(-8, 6 - h * 0.6);
      ctx.moveTo(6, 6); ctx.lineTo(8, 6 - h * 0.6);
      ctx.stroke();
      if (b.state === "ready") {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(0, 6 - h, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.fillStyle = "#f5c400";
    for (var f = 0; f < (b.fert || 0); f++) ctx.fillRect(-20 + f * 8, 12, 5, 5);
    ctx.restore();
  }

  function drawBober(ent, hat) {
    var im = hat ? imgHat : ((ent.tx != null) ? imgWalk : imgIdle);
    if (!im || !im.complete || !im.naturalWidth) {
      ctx.fillStyle = "#8b5a2b";
      ctx.beginPath();
      ctx.arc(ent.x, ent.y, 14, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    var h = 54;
    var w = im.naturalWidth * (h / im.naturalHeight);
    ctx.save();
    ctx.translate(ent.x, ent.y);
    ctx.scale(ent.face || 1, 1);
    if (!hat && FILTER[ent.id]) ctx.filter = FILTER[ent.id];
    ctx.drawImage(im, -w / 2, -h + 6, w, h);
    ctx.filter = "none";
    ctx.restore();
  }
  function drawSnow() {
    if (state.season !== 3) return;
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    ctx.fillRect(0, 320, WORLD_W, WORLD_H);
    ctx.fillStyle = "#fff";
    flakes.forEach(function (f) {
      ctx.fillRect(f.x, f.y, 2, 2);
    });
  }
  function draw() {
    resize();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.fillStyle = ["#67a44a", "#5c983f", "#c4a15a", "#d5e0e4"][state.season];
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.save();
    ctx.translate(viewOx, viewOy);
    ctx.scale(viewScale, viewScale);
    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.clip();
    ctx.translate(-camX, -camY);
    drawGround();
    drawPond();
    state.beds.forEach(drawBed);
    state.willows.forEach(drawWillow);
    drawBuildings();
    drawBober({ x: MOSS.x, y: MOSS.y, face: -1, id: "moss", tx: null }, false);
    state.crew.forEach(function (c) { drawBober(c, false); });
    drawBober(state.player, true);
    drawSnow();
    ctx.restore();
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    if (toastTill && ts > toastTill) document.getElementById("toast").classList.add("hidden");
    if (mode === "play") {
      state.clock += dt;
      if (state.mill.sack > 0) state.mill.t += dt;
      var arrived = moveEnt(state.player, dt);
      if (arrived && state.player.pending && Math.hypot(state.player.x - state.player.pending.x, state.player.y - state.player.pending.y) <= REACH + 6) {
        var pending = state.player.pending;
        state.player.pending = null;
        doHit(pending);
      }
      state.crew.forEach(function (c) {
        crewThink(c, dt);
        moveEnt(c, dt);
      });
      if (!looking) {
        camX += (state.player.x - VW / 2 - camX) * Math.min(1, dt * 4);
        camY += (state.player.y - VH / 2 - camY) * Math.min(1, dt * 4);
        clampCam();
      }
      if (state.clock >= DAY_LEN) endDay();
    }
    if (state.season === 3) {
      flakes.forEach(function (f) {
        f.y += dt * 30;
        if (f.y > WORLD_H) f.y = 300;
      });
    }
    if (state) { hud(); draw(); }
  }

  function bootPlay(fromSave) {
    sheetBack = "play";

    document.getElementById("dawn").classList.add("hidden");

    if (!fromSave) fresh();
    looking = false;
    camX = state.player.x - VW / 2;
    camY = state.player.y - VH / 2;
    clampCam();
    mode = "play";
    hud();
  }

  });
  canvas.addEventListener("pointermove", function (ev) {
    if (!ptr || ptr.id !== ev.pointerId) return;
    var dx = ev.clientX - ptr.x, dy = ev.clientY - ptr.y;
    ptr.moved = Math.max(ptr.moved, Math.hypot(dx, dy));
    if (ptr.moved > 8) {
      looking = true;
      camX = ptr.camX - dx / viewScale;
      camY = ptr.camY - dy / viewScale;
      clampCam();
    }
  });
  canvas.addEventListener("pointerup", function (ev) {
    if (!ptr || ptr.id !== ev.pointerId) { ptr = null; return; }
    var moved = ptr.moved;
    ptr = null;
    if (moved > 8) return;
    var w = worldFromEvent(ev);
    onTap(w.x, w.y);
  });
  window.addEventListener("resize", resize);

  for (var s = 0; s < 40; s++) flakes.push({ x: Math.random() * WORLD_W, y: 300 + Math.random() * 1800 });
  fresh();
  showSplash();
  resize();
  requestAnimationFrame(frame);

  window.WC = {
    get state() { return state; },
    price: price,
    boot: function () { bootPlay(false); },
    sleep: function () { if (mode === "play") endDay(); },
    water: function (i) { return waterBed(i); },
    plant: plant,
    chaff: layChaff,
    cutGrass: cutGrass,
    loadMill: loadMill,
    cutWillow: cutWillow,
    setDay: function (d) { state.day = d; },
    mode: function () { return mode; },
    cam: function () { return { x: camX, y: camY, scale: viewScale, ox: viewOx, oy: viewOy }; }
  };
})();
  </script>
</body>
